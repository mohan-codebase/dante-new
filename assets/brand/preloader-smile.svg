<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 128 62" width="128" height="62" role="img" aria-label="">
  <defs>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="80" y1="28" x2="80" y2="70">
      <stop offset="0" stop-color="#2aa8e0"/>
      <stop offset="1" stop-color="#144d7c"/>
    </linearGradient>
    <linearGradient id="wireGrad" gradientUnits="userSpaceOnUse" x1="26" y1="40" x2="134" y2="40">
      <stop offset="0" stop-color="#c08f3d"/>
      <stop offset=".5" stop-color="#edcb4a"/>
      <stop offset="1" stop-color="#c08f3d"/>
    </linearGradient>
  </defs>
  <style>
    /* Crooked teeth land along the arch from the centre out, straighten
       together, then the archwire threads through them. */
    .tooth {
      fill: #fff; stroke: url(#edge); stroke-width: 1.3;
      transform-box: fill-box; transform-origin: center;
      opacity: 0;
      animation: tooth 2.8s cubic-bezier(.34,1.4,.5,1) infinite;
    }
    .wire {
      fill: none; stroke: url(#wireGrad); stroke-width: 2.2; stroke-linecap: round;
      stroke-dasharray: 109; stroke-dashoffset: 109;
      animation: wire 2.8s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes tooth {
      0%, 6%   { opacity: 0; transform: rotate(var(--r)) translateY(-10px) scale(.4); }
      16%      { opacity: 1; transform: rotate(var(--r)) translateY(0) scale(1); }
      38%      { opacity: 1; transform: rotate(var(--r)) translateY(0) scale(1); }
      58%, 80% { opacity: 1; transform: rotate(0deg) translateY(0) scale(1); }
      94%,100% { opacity: 0; transform: rotate(0deg) translateY(0) scale(.9); }
    }
    @keyframes wire {
      0%, 60%  { stroke-dashoffset: 109; opacity: 1; }
      78%, 88% { stroke-dashoffset: 0; opacity: 1; }
      96%,100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tooth { opacity: 1; animation: none; transform: none; }
      .wire  { stroke-dashoffset: 0; animation: none; }
    }
  </style>
  <g>
    <g transform="translate(36.31 35.74) rotate(-54.0)"><rect class="tooth" style="--r:-17deg;animation-delay:0.42s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(43.87 44.13) rotate(-42.0)"><rect class="tooth" style="--r:-20deg;animation-delay:0.33s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(53.00 50.77) rotate(-30.0)"><rect class="tooth" style="--r:17deg;animation-delay:0.23s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(63.31 55.36) rotate(-18.0)"><rect class="tooth" style="--r:20deg;animation-delay:0.14s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(74.36 57.70) rotate(-6.0)"><rect class="tooth" style="--r:17deg;animation-delay:0.05s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(85.64 57.70) rotate(6.0)"><rect class="tooth" style="--r:-20deg;animation-delay:0.05s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(96.69 55.36) rotate(18.0)"><rect class="tooth" style="--r:-17deg;animation-delay:0.14s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(107.00 50.77) rotate(30.0)"><rect class="tooth" style="--r:-20deg;animation-delay:0.23s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(116.13 44.13) rotate(42.0)"><rect class="tooth" style="--r:17deg;animation-delay:0.33s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <g transform="translate(123.69 35.74) rotate(54.0)"><rect class="tooth" style="--r:20deg;animation-delay:0.42s" x="-4.00" y="-5.80" width="8.00" height="11.60" rx="2.80"/></g>
    <path class="wire" d="M34.21 32.62 A 54.0 54.0 0 0 0 125.79 32.62"/>
  </g>
</svg>
